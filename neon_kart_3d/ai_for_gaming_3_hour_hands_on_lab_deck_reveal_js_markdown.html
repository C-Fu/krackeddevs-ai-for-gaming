# AI for Gaming
### How AI is Changing the Way Games Are Made

**3-Hour Hands-On Lab: From Zero to Playable 3D Web Kart Racer**

* **Target Game Build:** **Neon Kart 3D** (Mario Kart Style 3D Circuit Racer)
* **Core Stack:** [Google Antigravity](https://antigravity.google/) • [OpenCode](https://opencode.ai/) • [Google Gemini](https://aistudio.google.com/) • [Blender MCP](https://github.com/ahujasid/mcp-for-blender) • [Three.js](https://threejs.org/)
* **Coding Required:** **0% Manual Coding** — 100% Agentic Vibe-Coding & Procedural 3D

Note:
Welcome everyone! Today you will act as Game Directors. Even if you have never written a single line of game code or opened Blender before, you will leave in 3 hours with a playable 3D Kart Racer running in your browser.

## Why "The Old Way" vs. The AI-Native Game Loop

* **Traditional Solo Game Dev (3–6 Months):**
  * Weeks stuck learning engine UI, quaternion math, UV unwrapping, and boilerplate state machines.
* **The AI-Native Game Studio Loop (3 Hours):**
  1. **Structured Mechanics Spec (`docs/GDD.md`):** AI translates game feel into explicit physics constants.
  2. **AI Project Management (`.xlsx` / Google Sheets):** AI breaks epics into 10-minute atomic tasks.
  3. **Modular Architecture (`docs/ARCHITECTURE.md`):** Enforces clean file boundaries + procedural fallbacks.
  4. **Agentic Coding ([Google Antigravity](https://antigravity.google/) & [OpenCode](https://opencode.ai/)):** Multi-file generation & live browser testing.
  5. **Procedural 3D ([MCP for Blender](https://github.com/ahujasid/mcp-for-blender)):** LLM controls Blender directly via Python socket server.

## Step 0: BYOD Laptop Setup (Windows & macOS)

Run the one-liner for your OS in **PowerShell (Admin)** or **macOS Terminal** to install Node.js, Git, Python `uv`, Blender, `yt-dlp`, and OpenCode CLI:

```powershell
# WINDOWS (PowerShell)
winget install OpenJS.NodeJS.LTS Git.Git BlenderFoundation.Blender yt-dlp.yt-dlp Gyan.FFmpeg
powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
npm install -g @opencode/cli@latest
```

```bash
# macOS (Terminal with Homebrew)
brew install node git uv yt-dlp ffmpeg
brew install --cask blender
npm install -g @opencode/cli@latest
```

* **GUI IDE Option:** Download [Google Antigravity IDE](https://antigravity.google/download/) (or the VS Code extension).

## Hour 1 (0:20 – 1:00): AI as Lead Game Designer & Producer

**Why most AI game prompts fail:**
* Asking *"Make me a 3D Mario Kart game"* produces a 200-line broken demo with unplayable steering.
* **The Fix:** Never let the AI write code until it writes the **Game Design Document (`docs/GDD.md`)** with explicit numerical handling constants.

| Vehicle Physics Constant | Symbol | Target Value | What It Controls |
| :--- | :--- | :--- | :--- |
| **Max Cruising Speed** | `MAX_SPEED` | `45.0 u/s` | Top speed on asphalt straightaways |
| **Boost Speed Cap** | `BOOST_MAX_SPEED` | `68.0 u/s` | Top speed during Drift Mini-Turbo or Mushroom |
| **Off-Road Grass Drag** | `OFFROAD_DRAG` | `0.91 / frame` | Penalty when leaving the track spline width |
| **Drift Turn Multiplier** | `DRIFT_MULT` | `1.5x` | Tighter cornering radius while holding `SPACE` |
| **Mini-Turbo Charge** | `DRIFT_CHARGE_TIME` | `1.0 sec` | Hold drift for 1s, release `SPACE` for orange turbo burst |

## Designing Clean Game Architecture (`docs/ARCHITECTURE.md`)

**Rule #1 of Vibe-Coding Games:** Separate **Config**, **World**, **Entities**, **Audio**, and **UI** into distinct files so the AI never overwrites your physics when editing the HUD.

```text
neon-kart-3d/
├── index.html                  # HUD overlay + Vite entry
├── opencode.json               # Gemini API + Blender MCP config
├── docs/
│   ├── GDD.md                  # Physics constants & item rules
│   ├── ARCHITECTURE.md         # Module contracts & fallback rules
│   └── BACKLOG.csv             # Sprint backlog for Google Sheets / Excel
├── public/assets/
│   ├── models/                 # Blender MCP exports (kart.glb, arch.glb)
│   └── audio/                  # yt-dlp / Suno BGM (bgm.mp3)
└── src/
    ├── main.js                 # Game loop & state machine
    ├── config/constants.js     # GDD physics & tuning constants
    ├── world/trackBuilder.js   # CatmullRomCurve3 road, curbs, pads
    ├── world/assetLoader.js    # GLTFLoader with procedural fallback!
    ├── entities/kartController.js # Drift, boost, & steering math
    ├── entities/aiDriver.js    # Spline waypoint rivals
    ├── audio/soundManager.js   # Web Audio API synth + MP3 BGM
    └── ui/hud.js               # Speedometer, lap timer, item slot
```

> **Workshop Secret Weapon ("Graceful Procedural Fallback"):** `assetLoader.js` automatically renders a sleek procedural Three.js kart if `public/assets/models/kart.glb` doesn't exist yet—so Hour 2 runs 100% bug-free before we open Blender in Hour 3!

## Hour 3A (2:00 – 2:30): Procedural 3D Pipeline with Blender + MCP

How **[MCP for Blender (`ahujasid/mcp-for-blender`)](https://github.com/ahujasid/mcp-for-blender)** changes 3D art creation:

```text
[ Google Antigravity / OpenCode (Gemini 2.5 Pro) ]
                       │
        (MCP Protocol via uvx mcp-for-blender)
                       ▼
      [ Blender 4.x Socket Server (Port 9876) ]
                       │
   Executes bpy Python: Bevel Chassis + 4 Neon Wheels + PBR Shaders
                       ▼
     Auto-Exports -> public/assets/models/kart.glb
```

1. Open **Blender** -> `Edit > Preferences > Add-ons` -> Enable **Interface: Blender MCP**.
2. Press `N` in the 3D Viewport -> Open the **BlenderMCP** tab -> Click **Start Server**.
3. Your coding agent can now inspect the 3D scene, create meshes, assign metallic/emissive materials, and export `.glb` files directly into your game repo!

## Hour 3C (2:45 – 3:00): Scaling from Prototype to Full Immersive 3D Game

Once your 3-hour prototype is live, here is the exact architectural upgrade path to turn **Neon Kart 3D** into a full commercial web game:

| Upgrade Layer | Prototype (Today's 3H Build) | Full Immersive 3D Game (Next Step) | Prompt / Tool to Upgrade |
| :--- | :--- | :--- | :--- |
| **Physics & Collisions** | Spline distance + arcade raycast kinematics | **[Rapier 3D (`@dimforge/rapier3d-compat`)](https://rapier.rs/)** rigid-body raycast vehicle suspension + trimesh track colliders | Ask OpenCode to wrap track mesh in `RAPIER.ColliderDesc.trimesh` |
| **Lighting & Shaders** | Directional light + exponential fog | **[Poly Haven](https://polyhaven.com/) 4K HDRI** environment reflections + Three.js `EffectComposer` + `UnrealBloomPass` | Load `.hdr` via `RGBELoader` + add bloom post-processing |
| **3D World & Animation** | Static `.glb` kart & procedural track | Skeletal wheel/suspension rigging in **Blender MCP** + multi-biome procedural spline tracks | Export animated actions in `.glb` and play via `THREE.AnimationMixer` |
| **Multiplayer** | 2 local spline AI rivals + `localStorage` | Real-time 8-player rooms via **WebSockets / PartyKit / WebRTC** | Sync `(x, z, heading, speed, item)` state packets at 20 Hz |

  <!-- Reveal.js 5.1.0 & Built-In Plugins (Markdown, Highlight, Notes) -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('copy-toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Copied to clipboard!');
        }).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Copied to clipboard!');
      } catch (e) {}
      document.body.removeChild(ta);
    }

    window.addEventListener('load', () => {
      Reveal.initialize({
        hash: true,
        controls: true,
        progress: true,
        center: true,
        slideNumber: 'c/t',
        width: 1200,
        height: 700,
        margin: 0.08,
        transition: 'slide',
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
      }).then(() => {
        // Attach 1-click Copy buttons to every code block and blockquote prompt
        document.querySelectorAll('.reveal pre').forEach((pre) => {
          const btn = document.createElement('button');
          btn.className = 'copy-code-btn';
          btn.textContent = 'Copy Code';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const codeEl = pre.querySelector('code');
            if (codeEl) copyTextToClipboard(codeEl.innerText.trim());
          });
          pre.appendChild(btn);
        });

        document.querySelectorAll('.reveal blockquote').forEach((bq) => {
          bq.style.position = 'relative';
          const btn = document.createElement('button');
          btn.className = 'copy-code-btn';
          btn.textContent = 'Copy Prompt';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            copyTextToClipboard(bq.innerText.replace('Copy Prompt', '').trim());
          });
          bq.appendChild(btn);
        });

        // Update slide counter in top bar
        const counterEl = document.getElementById('slide-counter');
        const updateCounter = () => {
          const idx = Reveal.getIndices();
          counterEl.textContent = `Slide ${idx.h + 1}${idx.v > 0 ? '.' + (idx.v + 1) : ''}`;
        };
        Reveal.on('slidechanged', updateCounter);
        updateCounter();
      });

      // Top navigation buttons
      document.getElementById('btn-jump-start').addEventListener('click', () => Reveal.slide(0, 0));
      document.getElementById('btn-jump-setup').addEventListener('click', () => Reveal.slide(3, 0));
      document.getElementById('btn-jump-hour1').addEventListener('click', () => Reveal.slide(4, 0));
      document.getElementById('btn-jump-hour2').addEventListener('click', () => Reveal.slide(7, 0));
      document.getElementById('btn-jump-hour3').addEventListener('click', () => Reveal.slide(8, 0));
      document.getElementById('btn-overview').addEventListener('click', () => Reveal.toggleOverview());
    });
  </script>
